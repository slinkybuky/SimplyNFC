name: Build iOS App

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'both'
        type: choice
        options:
          - ipa
          - tipa
          - both

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          xcode-select --install 2>/dev/null || echo "Xcode already installed"
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew install libimobiledevice
          # For tipa support
          pip3 install requests --break-system-packages
            brew install xcodegen || true

      - name: Create build directory
        run: mkdir -p build

      - name: Generate Xcode project
        run: |
          cd build
          xcodegen generate --spec ../project.yml

      - name: Build for iOS
        run: |
          xcodebuild \
            -project build/SimplyNFCApp.xcodeproj \
            -scheme SimplyNFCApp \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -arch arm64 \
            -sdk iphoneos \
            clean build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Create Archive
        run: |
          xcodebuild \
            -project build/SimplyNFCApp.xcodeproj \
            -scheme SimplyNFCApp \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -arch arm64 \
            -sdk iphoneos \
            -archivePath build/SimplyNFCApp.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Create IPA without signing
        run: |
          mkdir -p build/Payload
          cp -r "build/SimplyNFCApp.xcarchive/Products/Applications/SimplyNFCApp.app" "build/Payload/"
          cd build
          zip -r SimplyNFCApp.ipa Payload > /dev/null
          rm -rf Payload

      - name: Create TIPA for TrollStore
        if: success()
        run: |
          mkdir -p build/TIPA
          cp "build/SimplyNFCApp.ipa" "build/TIPA/SimplyNFCApp.tipa"
          echo "TIPA created at build/TIPA/SimplyNFCApp.tipa"

      - name: Verify builds
        run: |
          echo "=== Build Artifacts ==="
          find build -type f \( -name "*.ipa" -o -name "*.tipa" \) -exec ls -lh {} \;

      - name: Upload IPA to artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SimplyNFC-ipa
          path: build/*.ipa
          retention-days: 30
          if-no-files-found: warn

      - name: Upload TIPA to artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SimplyNFC-tipa
          path: build/TIPA/*.tipa
          retention-days: 30
          if-no-files-found: warn

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/*.ipa
            build/TIPA/*.tipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
